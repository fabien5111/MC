name: Configurer le CORS d'un conteneur Object Storage

# Lancement manuel depuis l'onglet « Actions » (bouton « Run workflow »).
#
# Pose les métadonnées CORS d'un conteneur Swift du Public Cloud Infomaniak.
# Sans elles, une image du conteneur s'affiche parfaitement dans le navigateur
# mais **pollue le canvas** : `chargerImageDepuisSrc` (lib/images.ts) pose
# `crossOrigin = 'anonymous'`, le chargement est alors refusé, et rééditer une
# photo ou recalculer une vignette cesse de fonctionner. C'est le pendant
# serveur de ce correctif : l'un sans l'autre ne sert à rien.
#
# Cette configuration ne se fait ni depuis Horizon (qui n'expose pas l'édition
# de métadonnées de conteneur) ni depuis l'application : elle passe par l'API
# Swift, d'où ce workflow — il permet de la poser sans aucun outil installé
# localement, et de la rejouer à l'identique sur chaque nouveau conteneur.
#
# Secrets attendus (Settings > Secrets and variables > Actions). Toutes ces
# valeurs se lisent dans le fichier RC OpenStack : Horizon > Projet >
# Accès API > « Télécharger le fichier RC OpenStack ».
#   OS_AUTH_URL             ex. https://api.pub2.infomaniak.cloud/identity/v3
#   OS_PROJECT_NAME         ex. PCP-XXXXXXX
#   OS_USERNAME             ex. PCU-XXXXXXX
#   OS_PASSWORD             mot de passe de l'utilisateur OpenStack
#   OS_REGION_NAME          ex. dc4-a
#   OS_USER_DOMAIN_NAME     ex. default
#   OS_PROJECT_DOMAIN_NAME  ex. default
on:
  workflow_dispatch:
    inputs:
      conteneur:
        description: Nom du conteneur Swift
        required: true
        default: test-photos
      origine:
        description: >-
          Valeur de Access-Control-Allow-Origin. « * » est le bon choix pour un
          conteneur d'images publiques : Swift ne sait pas comparer une liste
          d'origines, et le site a plusieurs domaines (www, dev, préversions).
        required: true
        default: '*'
      acces_public:
        description: >-
          Objets lisibles par leur URL (.r:*), sans énumération (.rlistings).
          COCHÉ pour jp-photos. À DÉCOCHER pour jp-contact : ses photos sont des
          données personnelles, elles ne doivent se lire que par URL signée.
        type: boolean
        required: true
        default: true

jobs:
  cors:
    runs-on: ubuntu-latest
    env:
      OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
      OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
      OS_USERNAME: ${{ secrets.OS_USERNAME }}
      OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
      OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
      OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
      OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
      OS_IDENTITY_API_VERSION: '3'
      CONTENEUR: ${{ inputs.conteneur }}
      ORIGINE: ${{ inputs.origine }}
    steps:
      - name: Installer le client Swift
        run: pip install --quiet python-swiftclient python-keystoneclient

      - name: Poser les métadonnées CORS
        run: |
          set -euo pipefail
          # `--meta Clé:Valeur` devient l'en-tête X-Container-Meta-Clé côté Swift.
          # Expose-Headers est nécessaire pour que le navigateur laisse le code
          # lire Content-Type et Etag ; sans lui, seuls les en-têtes « sûrs »
          # sont visibles.
          swift post "$CONTENEUR" \
            --meta "Access-Control-Allow-Origin:$ORIGINE" \
            --meta "Access-Control-Expose-Headers:Content-Length,Content-Type,Etag,Last-Modified" \
            --meta "Access-Control-Max-Age:3600"

      - name: Régler l'accès en lecture
        run: |
          set -euo pipefail
          # Ce réglage est le plus dangereux du workflow, parce qu'il est muet :
          # poser `.r:*` sur le mauvais conteneur ne produit aucune erreur, et
          # rend d'un coup lisibles par leur URL des données personnelles.
          #
          # `.r:*` seul = objets lisibles par leur URL, liste du conteneur non
          # publique. L'option « accès public » de Horizon ajoute `.rlistings`,
          # qui laisse énumérer tous les fichiers — une fuite silencieuse une
          # fois les photos migrées.
          #
          # ACL vide = rien de public. Les objets ne se lisent alors que par
          # une URL TempURL signée (lib/storage-data.ts).
          if [ "${{ inputs.acces_public }}" = "true" ]; then
            swift post "$CONTENEUR" --read-acl '.r:*'
            echo "$CONTENEUR : objets lisibles par URL, énumération fermée."
          else
            swift post "$CONTENEUR" --read-acl ''
            echo "$CONTENEUR : aucun accès public. Lecture par URL signée uniquement."
          fi

      - name: Vérifier que l'en-tête est bien renvoyé
        if: ${{ inputs.acces_public }}
        run: |
          set -euo pipefail
          # Uniquement sur un conteneur public : sur un conteneur privé, un GET
          # nu est refusé, et l'absence d'en-tête ne prouverait rien.
          # `swift auth` écrit OS_STORAGE_URL et OS_AUTH_TOKEN sur sa sortie :
          # on l'évalue sans jamais l'afficher, le jeton n'a rien à faire dans
          # les journaux du workflow.
          eval "$(swift auth)"

          objet=$(swift list "$CONTENEUR" | head -1)
          if [ -z "$objet" ]; then
            echo "Conteneur vide : métadonnées posées, vérification impossible."
            swift stat "$CONTENEUR"
            exit 0
          fi

          url="$OS_STORAGE_URL/$CONTENEUR/$objet"
          echo "Vérification sur : $CONTENEUR/$objet"

          entetes=$(curl -sS -I -H 'Origin: https://dev.jepatisse.com' "$url")
          echo "$entetes"

          if echo "$entetes" | grep -qi '^access-control-allow-origin:'; then
            echo "OK — le conteneur renvoie Access-Control-Allow-Origin."
          else
            echo "ÉCHEC — en-tête absent : le traitement canvas resterait refusé."
            exit 1
          fi
