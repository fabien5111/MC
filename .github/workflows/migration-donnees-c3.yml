name: Migration — chargement des données (lot C3)

# Lancement manuel depuis l'onglet « Actions » (bouton « Run workflow »).
#
# Transporte les DONNÉES du schéma `public` — recettes, profils, fournées,
# idées, messages de contact — de Supabase vers la cible Virtuozzo, puis prouve
# que chaque table est arrivée au même nombre de lignes
# (docs/migration-infomaniak.md § 7.10, séquence de chargement du C3).
#
# ─── Sa place exacte dans la séquence du C3 ───
#
#   1. GoTrue démarre et crée le schéma `auth`              (fait, palier 2)
#   2. Restauration du DDL `public`, SANS données           (migration-restauration-repetition.yml)
#   3. Chargement de auth.users puis auth.identities        (migration-identites-c1.yml, mode « transferer »)
#   4. Chargement des données `public`, profiles comprise   ← CE WORKFLOW
#   5. Création de on_auth_user_created                     ← CE WORKFLOW, dernier geste
#
# L'ordre 3 avant 4 n'est pas une consigne à retenir : la garde 1 refuse de
# charger tant que `auth.users` est vide, parce que `profiles.id` porte une
# clé étrangère vers elle.
#
# ─── Pourquoi les triggers sont neutralisés pendant le chargement ───
#
# Ce n'est pas un confort, c'est la condition pour que le chargement ABOUTISSE
# et soit FIDÈLE. Trois triggers de l'application le prouvent (cf. CLAUDE.md) :
#
#   - `ideas_check_quota` refuse plus de 5 idées par membre et par 24 h. Un
#     chargement en masse le déclenche et ÉCHOUE.
#   - `comments_recompute_recipe_rating` réécrirait `recipes.rating_avg` au fil
#     des insertions, par-dessus les valeurs déjà justes du dump.
#   - `ideas_auto_vote_author` fabriquerait un vote par idée insérée, en plus
#     de ceux que le dump apporte déjà.
#
# Le dump porte le RÉSULTAT de ces triggers, pas leur déclencheur : les
# rejouer, c'est les appliquer deux fois. D'où `session_replication_role =
# replica` le temps du chargement — qui neutralise aussi les contrôles de clé
# étrangère, d'où la vérification d'intégrité rejouée à la fin.
#
# ─── Doctrine de confidentialité, reprise du transfert d'identités ───
#
# Le dépôt est PUBLIC et ce dump porte des recettes privées, des adresses
# e-mail et des messages de contact. Donc, tenu par la construction du fichier :
#   1. AUCUN `upload-artifact` — le dump meurt avec le runner.
#   2. AUCUNE ligne de données sur la sortie standard. Les contrôles rendent
#      des DÉCOMPTES par table, jamais une valeur.
#   3. `-v VERBOSITY=terse` sur tout psql qui écrit : sans lui, une erreur de
#      COPY réaffiche la LIGNE fautive.
#   4. La définition du trigger est lue sur la source et appliquée sans être
#      affichée — le § 7.10 demande qu'elle reste hors du dépôt.
#
# Secrets attendus (Settings > Secrets and variables > Actions) :
#   SUPABASE_DB_URL   source — « Session pooler », port 5432
#   VZ_PG_HOST        cible — hôte de l'« Access URL » de l'Endpoint Virtuozzo
#   VZ_PG_PORT        cible — « Public Port » attribué par la plateforme
#   VZ_PG_PASSWORD    cible — POSTGRES_PASSWORD du conteneur
on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          « verifier » (défaut) compare les deux côtés sans rien écrire — à
          jouer d'abord, et à rejouer après. « charger » VIDE toutes les tables
          de `public` sur la cible, puis les recharge depuis la source.
        type: choice
        options: [verifier, charger]
        default: verifier
      base:
        description: Base cible
        required: true
        default: postgres
      confirmer:
        description: >-
          Pour « charger » uniquement : taper exactement REMPLACER. Le
          chargement vide TOUTES les tables du schéma `public` de la cible
          avant d'écrire — même doctrine que le transfert d'identités.
          ATTENTION : une fois le site basculé et rouvert (C3 étape 11), ce
          mode est DÉFINITIVEMENT hors d'usage — il effacerait toutes les
          écritures des membres depuis la bascule. Seul « verifier » reste
          jouable ensuite.
        required: false
        default: ''

jobs:
  donnees:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGHOST: ${{ secrets.VZ_PG_HOST }}
      PGPORT: ${{ secrets.VZ_PG_PORT }}
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.VZ_PG_PASSWORD }}
      PGDATABASE: ${{ inputs.base }}
      PGCONNECT_TIMEOUT: '15'
      PGOPTIONS: '-c client_min_messages=warning'
    steps:
      # `pg_dump` refuse de tirer d'un serveur plus récent que lui, et la
      # source est en PostgreSQL 17 (§ 2.5).
      - name: Installer le client PostgreSQL 17
        run: |
          set -euo pipefail
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Vérifier la forme de la chaîne de connexion
        run: |
          set -euo pipefail
          # Le `case` ne réaffiche jamais la chaîne : elle porte le mot de
          # passe de production, et un FRAGMENT de secret n'est pas masqué.
          case "$SUPABASE_DB_URL" in
            *db.*.supabase.co*)
              echo "ÉCHEC — SUPABASE_DB_URL porte la connexion DIRECTE (IPv6 seul)."
              echo "Prendre l'onglet « Session pooler », port 5432."
              exit 1 ;;
            *:6543/*)
              echo "ÉCHEC — SUPABASE_DB_URL porte le pooler TRANSACTIONNEL (6543)."
              echo "Il coupe les sessions longues et fait échouer pg_dump."
              exit 1 ;;
          esac
          echo "Forme de la chaîne conforme (Session pooler)."

      - name: Joindre la cible
        run: |
          set -euo pipefail
          psql -Atc 'select version()' > /dev/null
          echo "Cible joignable."

      # ─────────────────────────────────────────────────────────────
      # Quatre gardes AVANT d'écrire. Chacune répond à un échec qu'on préfère
      # lire ici plutôt qu'au milieu d'une fenêtre de maintenance.
      # ─────────────────────────────────────────────────────────────

      # 1. L'ordre du § 7.10 rendu mécanique. `profiles.id` référence
      #    `auth.users` : charger `public` sur une cible sans comptes
      #    produirait soit un échec de clé étrangère, soit — pire, en mode
      #    replica où les FK ne sont pas contrôlées — des profils orphelins
      #    silencieux.
      - name: Garde 1 — auth.users doit déjà être chargée
        run: |
          set -euo pipefail
          src=$(psql "$SUPABASE_DB_URL" -Atc 'select count(*) from auth.users')
          dst=$(psql                    -Atc 'select count(*) from auth.users')
          echo "comptes — source : $src / cible : $dst"
          if [ "$dst" = "0" ]; then
            echo "ÉCHEC — la cible n'a aucun compte."
            echo "Jouer d'abord migration-identites-c1.yml en mode « transferer »"
            echo "(étape 3 de la séquence du C3), puis revenir ici."
            exit 1
          fi
          if [ "$src" != "$dst" ]; then
            echo "ÉCHEC — les comptes diffèrent : $src côté source, $dst côté cible."
            echo "Les identités ont été transférées AVANT la dernière inscription."
            echo "Rejouer migration-identites-c1.yml pour repartir d'un état frais."
            exit 1
          fi
          echo "Comptes alignés des deux côtés."

      # 2. Les tables doivent être les mêmes. Une table présente d'un seul
      #    côté fait échouer le chargement à mi-parcours ; un DDL en retard
      #    sur la source est le cas le plus probable.
      - name: Garde 2 — les tables de public doivent correspondre
        run: |
          set -euo pipefail
          cat > tables.sql <<'SQL'
          select table_name
            from information_schema.tables
           where table_schema = 'public' and table_type = 'BASE TABLE'
           order by table_name;
          SQL
          psql "$SUPABASE_DB_URL" -Atf tables.sql > tables-source.txt
          psql                    -Atf tables.sql > tables-cible.txt
          printf 'tables — source : %s / cible : %s\n' \
            "$(wc -l < tables-source.txt)" "$(wc -l < tables-cible.txt)"
          if ! diff -q tables-source.txt tables-cible.txt > /dev/null; then
            echo "ÉCHEC — les listes de tables diffèrent :"
            diff tables-source.txt tables-cible.txt || true
            echo "Rejouer migration-restauration-repetition.yml en mode « restaurer »."
            exit 1
          fi
          echo "Mêmes tables des deux côtés."

      # 3. `session_replication_role` exige le superutilisateur — or `postgres`
      #    ne l'est PAS sur l'image supabase/postgres (§ 7.11, piège 1). Depuis
      #    PostgreSQL 15, le droit se délègue paramètre par paramètre, ce qui
      #    évite d'avoir à se connecter en supabase_admin depuis un workflow.
      - name: Garde 3 — postgres doit pouvoir neutraliser les triggers
        run: |
          set -euo pipefail
          if psql -q -v ON_ERROR_STOP=1 \
               -c 'set session_replication_role = replica' \
               -c 'set session_replication_role = origin' 2>/dev/null; then
            echo "session_replication_role : accessible."
          else
            echo "ÉCHEC — postgres ne peut pas régler session_replication_role."
            echo "Sans lui, ideas_check_quota fera échouer le chargement des idées,"
            echo "et comments_recompute_recipe_rating réécrira les notes moyennes."
            echo ""
            echo "À jouer UNE FOIS sur le nœud Postgres, en supabase_admin :"
            echo "    grant set on parameter session_replication_role to postgres;"
            exit 1
          fi

      # 4. Le dernier geste de la séquence — créer le trigger — écrit sur
      #    `auth.users`, qui appartient à `supabase_auth_admin`. Le § 7.10
      #    notait cette appartenance comme « vraisemblable mais à vérifier
      #    plutôt qu'à espérer au milieu d'une fenêtre de maintenance ».
      #    C'est ici qu'on la vérifie, avant d'avoir touché à quoi que ce soit.
      - name: Garde 4 — postgres doit pouvoir créer le trigger final
        run: |
          set -euo pipefail
          ok=$(psql -Atc "select pg_has_role('postgres', 'supabase_auth_admin', 'MEMBER')")
          if [ "$ok" != "t" ]; then
            echo "ÉCHEC — postgres n'est pas membre de supabase_auth_admin :"
            echo "l'étape 5 de la séquence (création du trigger) échouerait APRÈS"
            echo "le chargement, laissant la cible dans un état à moitié migré."
            echo ""
            echo "À jouer UNE FOIS sur le nœud Postgres, en supabase_admin :"
            echo "    grant supabase_auth_admin to postgres;"
            exit 1
          fi
          echo "postgres est membre de supabase_auth_admin."

      # 5. `truncate ... cascade` ne doit jamais sortir de `public`. Si une
      #    table d'un AUTRE schéma référençait `public`, la cascade la viderait
      #    aussi — y compris, potentiellement, du contenu de `auth`.
      - name: Garde 5 — rien hors de public ne doit référencer public
        run: |
          set -euo pipefail
          n=$(psql -Atc "
            select count(*)
              from pg_constraint c
              join pg_class      ch on ch.oid = c.conrelid
              join pg_namespace  nh on nh.oid = ch.relnamespace
              join pg_class      pa on pa.oid = c.confrelid
              join pg_namespace  np on np.oid = pa.relnamespace
             where c.contype = 'f' and np.nspname = 'public' and nh.nspname <> 'public'")
          if [ "$n" != "0" ]; then
            echo "ÉCHEC — $n clé(s) étrangère(s) pointent vers public depuis un autre schéma."
            echo "Un truncate ... cascade sortirait du périmètre voulu. À examiner à la main."
            exit 1
          fi
          echo "Aucune référence entrante hors de public : la cascade reste bornée."

      # ─────────────────────────────────────────────────────────────
      - name: Tirer les données de la source
        if: ${{ inputs.mode == 'charger' }}
        run: |
          set -euo pipefail
          umask 077
          # --data-only : le DDL est déjà en place (étape 2 de la séquence).
          # --disable-triggers n'est PAS utilisé : il exige le superutilisateur
          # sur la cible. On neutralise par session_replication_role à la place
          # (garde 3), ce qui a le même effet et se délègue proprement.
          # Les `setval` des séquences sont inclus par --data-only : sans eux,
          # la première insertion après bascule réutiliserait un identifiant.
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges \
                  -n public -f donnees.sql
          printf 'donnees.sql : %s octets\n' "$(wc -c < donnees.sql)"

      - name: Charger sur la cible
        if: ${{ inputs.mode == 'charger' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmer }}" != "REMPLACER" ]; then
            echo "ÉCHEC — le mode « charger » vide toutes les tables de public."
            echo "Taper exactement REMPLACER dans le champ « confirmer » pour le vouloir."
            exit 1
          fi

          # La liste des tables est construite sur la cible plutôt qu'écrite en
          # dur : elle suit le schéma au lieu de le figer, et la garde 2 vient
          # de prouver qu'elle est identique à celle de la source.
          psql -Atc "
            select 'truncate table ' ||
                   string_agg(format('%I.%I', schemaname, tablename), ', ') ||
                   ' cascade;'
              from pg_tables where schemaname = 'public'" > vider.sql

          # Une seule transaction pour tout : vidage, neutralisation des
          # triggers, chargement. Ou la cible bascule entièrement, ou elle ne
          # bouge pas — jamais un état à moitié chargé, qui serait le pire des
          # trois puisqu'il se lit comme un succès.
          #
          # VERBOSITY=terse : sans lui, une erreur de COPY réaffiche la ligne
          # fautive, c'est-à-dire une recette ou un message de contact, dans un
          # journal public.
          {
            echo "set session_replication_role = replica;"
            cat vider.sql
            cat donnees.sql
            echo "set session_replication_role = origin;"
          } > chargement.sql

          psql -q -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
               --single-transaction -f chargement.sql
          echo "Chargement terminé."

      # Le mode replica contourne les contrôles de clé étrangère sans marquer
      # les contraintes invalides. `ALTER TABLE ... VALIDATE CONSTRAINT` serait
      # donc un NO-OP : PostgreSQL les croit déjà valides et ne revérifie rien.
      # L'écrire aurait produit un « toutes les clés tiennent » qui n'aurait
      # rien mesuré — un contrôle faux est pire qu'un contrôle absent.
      #
      # Ce qui garantit réellement l'intégrité ici : la source est cohérente,
      # le dump est complet, et TOUTES les tables arrivent dans UNE transaction.
      # C'est la comparaison ligne à ligne de l'étape suivante qui le prouve.
      #
      # Reste une couture que ce raisonnement ne couvre pas : `profiles.id`
      # référence `auth.users`, chargée par un AUTRE workflow, à un AUTRE
      # moment. C'est le seul endroit où un décalage est plausible — donc le
      # seul qui mérite un contrôle explicite.
      - name: Contrôler la couture profiles → auth.users
        if: ${{ inputs.mode == 'charger' }}
        run: |
          set -euo pipefail
          orphelins=$(psql -Atc "
            select count(*) from public.profiles p
             where not exists (select 1 from auth.users u where u.id = p.id)")
          echo "profils sans compte auth : $orphelins"
          if [ "$orphelins" != "0" ]; then
            echo "ÉCHEC — $orphelins profil(s) orphelin(s)."
            echo "auth.users a été chargée avant que ces profils n'existent côté source."
            echo "Rejouer migration-identites-c1.yml, puis ce workflow."
            exit 1
          fi
          echo "Aucun orphelin : la couture entre les deux chargements tient."

      # ─────────────────────────────────────────────────────────────
      # ÉTAPE 5 DE LA SÉQUENCE — le dernier geste, celui que le § 7.10 voulait
      # « explicite et vérifiable » pour qu'il soit impossible à oublier.
      #
      # La définition est LUE SUR LA SOURCE et appliquée sans être affichée :
      # le § 7.10 demande qu'elle ne rejoigne pas ce dépôt public. On ne la
      # réécrit donc pas ici — on la recopie.
      # ─────────────────────────────────────────────────────────────
      - name: Recréer on_auth_user_created (dernier geste)
        if: ${{ inputs.mode == 'charger' }}
        run: |
          set -euo pipefail
          umask 077
          psql "$SUPABASE_DB_URL" -Atc "
            select pg_get_triggerdef(t.oid) || ';'
              from pg_trigger t
              join pg_class c      on c.oid = t.tgrelid
              join pg_namespace n  on n.oid = c.relnamespace
             where n.nspname = 'auth' and c.relname = 'users'
               and not t.tgisinternal" > triggers.sql

          if [ ! -s triggers.sql ]; then
            echo "ÉCHEC — la source ne porte aucun trigger sur auth.users."
            echo "Inattendu : le § 7.10 en a mesuré un le 06/09. À vérifier à la main."
            exit 1
          fi
          echo "$(wc -l < triggers.sql) trigger(s) relevé(s) sur la source."

          # Les suppressions sont construites depuis la CIBLE plutôt qu'écrites
          # en dur sur le seul nom attendu : si un second trigger existait,
          # `create` échouerait sur un doublon. Rejouable telle quelle.
          psql -Atc "
            select 'drop trigger if exists ' || quote_ident(t.tgname) ||
                   ' on auth.users;'
              from pg_trigger t
              join pg_class c     on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'auth' and c.relname = 'users'
               and not t.tgisinternal" > supprimer-triggers.sql

          # `set role` : auth.users appartient à supabase_auth_admin (garde 4).
          {
            echo "set role supabase_auth_admin;"
            cat supprimer-triggers.sql
            cat triggers.sql
            echo "reset role;"
          } > creer-trigger.sql

          psql -q -v ON_ERROR_STOP=1 -v VERBOSITY=terse \
               --single-transaction -f creer-trigger.sql

          pose=$(psql -Atc "
            select count(*) from pg_trigger t
              join pg_class c     on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'auth' and c.relname = 'users' and not t.tgisinternal")
          echo "Triggers en place sur auth.users côté cible : $pose"
          [ "$pose" != "0" ] || { echo "ÉCHEC — aucun trigger après création."; exit 1; }

      # ─────────────────────────────────────────────────────────────
      # La preuve. Un décompte exact par table, joué à l'identique des deux
      # côtés — publiable tel quel : que des noms de tables et des nombres.
      #
      # `query_to_xml` plutôt que `n_live_tup` : ce dernier est une ESTIMATION
      # de l'autovacuum, qui peut être fausse de plusieurs pourcents juste
      # après un chargement en masse — précisément le moment où on l'interroge.
      # ─────────────────────────────────────────────────────────────
      - name: Comparer les deux côtés, table par table
        run: |
          set -euo pipefail
          cat > compte.sql <<'SQL'
          select t.table_name || ':' ||
                 (xpath('/row/c/text()', query_to_xml(
                    format('select count(*) as c from public.%I', t.table_name),
                    false, true, '')))[1]::text
            from information_schema.tables t
           where t.table_schema = 'public' and t.table_type = 'BASE TABLE'
           order by t.table_name;
          SQL
          psql "$SUPABASE_DB_URL" -Atf compte.sql | LC_ALL=C sort > compte-source.txt
          psql                    -Atf compte.sql | LC_ALL=C sort > compte-cible.txt

          total_src=$(awk -F: '{s+=$2} END {print s+0}' compte-source.txt)
          total_dst=$(awk -F: '{s+=$2} END {print s+0}' compte-cible.txt)
          printf 'lignes au total — source : %s / cible : %s\n' "$total_src" "$total_dst"

          # ─── Le SENS de l'écart, pas seulement son existence ───
          #
          # La version d'origine exigeait l'égalité stricte. Juste après un
          # chargement, c'est le bon critère. Mais ce workflow est AUSSI
          # l'étape 12 du C3 (§ 7.13) : on le rejoue en mode « verifier »
          # APRÈS la réouverture, pour débusquer une écriture qui aurait
          # franchi le gel. À ce moment-là les deux bases ont légitimement
          # divergé — le site tourne sur la cible — et exiger l'égalité
          # rendait ce contrôle rouge par construction (mesuré le 11/09,
          # § 7.14 : ad_events +11, visit_sessions +2, de la simple
          # télémétrie de navigation).
          #
          # Ce qu'on cherche réellement n'est pas la différence, c'est sa
          # DIRECTION :
          #   cible  > source  → écrit sur la NOUVELLE base depuis la
          #                      bascule. Normal, c'est la production.
          #   source > cible   → écrit sur l'ANCIENNE base après le dump :
          #                      une écriture a franchi le gel. C'est le
          #                      seul cas qui demande une reprise à la main,
          #                      et c'est pour lui que l'étape 12 existe.
          awk -F: '
          NR==FNR { s[$1]=$2; next }
          { c[$1]=$2 }
          END {
            for (t in s) {
              if (!(t in c))            printf "MANQUE\t%s\tsource=%s\tcible=absente\n", t, s[t];
              else if (s[t]+0 > c[t]+0) printf "SOURCE_DEVANT\t%s\tsource=%s\tcible=%s\n", t, s[t], c[t];
              else if (s[t]+0 < c[t]+0) printf "CIBLE_DEVANT\t%s\tsource=%s\tcible=%s\n", t, s[t], c[t];
            }
            for (t in c) if (!(t in s)) printf "MANQUE\t%s\tsource=absente\tcible=%s\n", t, c[t];
          }' compte-source.txt compte-cible.txt | LC_ALL=C sort > ecarts.txt

          source_devant=$(grep -c '^SOURCE_DEVANT' ecarts.txt || true)
          cible_devant=$(grep -c '^CIBLE_DEVANT'  ecarts.txt || true)
          manques=$(grep -c '^MANQUE'             ecarts.txt || true)

          if [ ! -s ecarts.txt ]; then
            echo "IDENTIQUE — chaque table de public porte le même nombre de lignes"
            echo "des deux côtés."
            exit 0
          fi

          cat ecarts.txt

          if [ "$manques" != "0" ]; then
            echo "ÉCHEC — $manques table(s) présente(s) d'un seul côté."
            exit 1
          fi

          if [ "$source_devant" != "0" ]; then
            echo "ÉCHEC — $source_devant table(s) où la SOURCE est devant :"
            echo "des lignes ont été écrites sur l'ancienne base après le dump."
            echo "À reporter à la main sur la cible, table par table."
            exit 1
          fi

          if [ "${{ inputs.mode }}" = "charger" ]; then
            echo "ÉCHEC — $cible_devant écart(s) juste après un chargement :"
            echo "à cet instant précis les deux bases doivent être identiques."
            exit 1
          fi

          echo "GO — $cible_devant table(s) en avance côté CIBLE, aucune côté source."
          echo "Ce sens-là est celui de la production : rien n'a franchi le gel,"
          echo "il n'y a aucune écriture à reporter."

      # Le runner meurt de toute façon, mais l'effacement explicite dit
      # l'intention : ces fichiers ne survivent à aucune étape.
      - name: Effacer les fichiers de transfert
        if: always()
        run: |
          rm -f donnees.sql chargement.sql vider.sql \
                triggers.sql supprimer-triggers.sql creer-trigger.sql \
                tables.sql tables-source.txt tables-cible.txt \
                compte.sql compte-source.txt compte-cible.txt ecarts.txt
