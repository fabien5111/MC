name: Régénérer les types de la base

# Lancement manuel depuis l'onglet « Actions » (bouton « Run workflow »).
# Régénère lib/database.types.ts depuis la base live et le propose dans une
# pull request. Aucun geste hors de GitHub.
#
# ─────────────────────────────────────────────────────────────────────────
# COMMENT LE RUNNER JOINT LA BASE — sans Endpoint
# ─────────────────────────────────────────────────────────────────────────
# Le port 5432 n'est pas exposé sur Internet (§ 7.9 du dossier de migration).
# Jusqu'au 04/10/2026, il fallait donc ouvrir un Endpoint temporaire sur le
# nœud PostgreSQL avant chaque régénération, puis le refermer. Désormais, le
# runner passe par l'accès SSH du nœud applicatif (216658) — le même que
# `deploiement-app.yml`, mêmes secrets DEPLOY_SSH_* — et le nœud relaie vers
# la base par le réseau interne d'Infomaniak (scripts/tunnel-bdd.mjs).
#
# Secret GEN_TYPES_DB_URL : adresse INTERNE de la base, rôle `gen_types`
#   postgresql://gen_types:<mot de passe>@10.101.32.133:5432/postgres?sslmode=disable
# `gen_types` ne porte que le privilège REFERENCES sur les tables : il voit
# leur structure (ce dont la génération a besoin), jamais leurs données.
# Création du rôle : DEPLOY.md § « Régénérer les types de la base ».
#
# ─────────────────────────────────────────────────────────────────────────
# JAMAIS D'ÉCRITURE DIRECTE SUR `main`
# ─────────────────────────────────────────────────────────────────────────
# Le 03/10/2026, une régénération lancée sur `main` avec un rôle qui ne voyait
# pas toutes les tables y a committé un fichier amputé : 84 erreurs de types,
# déploiements bloqués jusqu'à l'annulation. Le résultat part donc sur une
# branche dédiée et arrive en pull request (typecheck indiqué dedans) : un
# fichier incomplet se voit dans le diff (tables retirées) avant la fusion.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gen-types
  cancel-in-progress: false

jobs:
  gen-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Préparer la connexion SSH au nœud applicatif
        uses: ./.github/actions/preparer-connexion-ssh
        with:
          cle: ${{ secrets.DEPLOY_SSH_KEY }}
          hote: ${{ secrets.DEPLOY_SSH_HOST }}
          utilisateur: ${{ secrets.DEPLOY_SSH_USER }}
          port: ${{ vars.DEPLOY_SSH_PORT || '3022' }}
          hotes-connus: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          alias: noeud-app
          prefixe-secret: DEPLOY_SSH

      # Passe par scripts/gen-types.mjs (npm run gen:types) et non par une
      # redirection directe : le script n'écrit la cible qu'une fois la
      # génération réellement aboutie, et sort en échec sinon. C'est lui qui
      # ouvre le tunnel (GEN_TYPES_SSH) et le referme.
      - name: Générer les types depuis la base
        env:
          GEN_TYPES_DB_URL: ${{ secrets.GEN_TYPES_DB_URL }}
          GEN_TYPES_SSH: noeud-app
        run: npm run gen:types

      - name: Y a-t-il un changement ?
        id: diff
        run: |
          if git diff --quiet -- lib/database.types.ts; then
            echo "change=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Types déjà à jour — rien à proposer."
          else
            echo "change=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- lib/database.types.ts
          fi

      # Le typecheck ne bloque PAS la pull request : c'est dans la PR qu'on
      # adapte le code aux nouveaux types. Exemple réel (04/10/2026) : le
      # garde-fou de lib/auth.ts casse volontairement la compilation quand
      # `profiles` gagne une colonne, pour forcer la décision « chargée à
      # chaque page ou non ». Bloquer ici rendait le fichier généré invisible,
      # donc la correction impossible. `main` reste protégé : rien n'y entre
      # sans fusion, et le déploiement refait le typecheck.
      - name: Vérifier que le code compile avec les nouveaux types
        id: typecheck
        if: steps.diff.outputs.change == 'true'
        run: |
          cp .env.local.example .env.local
          if npm run typecheck > typecheck.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          cat typecheck.log

      - name: Proposer les types dans une pull request
        if: steps.diff.outputs.change == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TYPECHECK_OK: ${{ steps.typecheck.outputs.ok }}
        run: |
          BRANCHE="types/regeneration-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCHE"
          git add lib/database.types.ts
          git commit -m "Types : régénération authentique depuis la base (gen types)"
          git push origin "$BRANCHE"

          {
            echo "Régénération de \`lib/database.types.ts\` depuis la base live (workflow « Régénérer les types de la base », exécution ${{ github.run_id }})."
            echo
            if [ "$TYPECHECK_OK" = "true" ]; then
              echo "✅ \`npm run typecheck\` passe avec ces types."
            else
              echo "❌ \`npm run typecheck\` échoue avec ces types — le code est à adapter **dans cette PR** avant de fusionner :"
              echo
              echo '```'
              grep -E 'error TS' typecheck.log | head -40
              echo '```'
            fi
            echo
            echo "À relire avant de fusionner : une table **retirée** du fichier signale un rôle \`gen_types\` qui ne la voit pas (privilège REFERENCES manquant, cf. DEPLOY.md), pas une table supprimée."
          } > corps.md
          TITRE="Types : régénération depuis la base"
          [ "$TYPECHECK_OK" = "true" ] || TITRE="$TITRE (code à adapter)"
          # Créer une PR depuis Actions exige le réglage « Allow GitHub Actions
          # to create and approve pull requests » (Settings > Actions >
          # General). Sans lui, la branche est poussée et le lien de création
          # est donné : rien n'est perdu.
          if ! gh pr create --base main --head "$BRANCHE" \
               --title "$TITRE" \
               --body-file corps.md; then
            echo "::warning::Pull request non créée automatiquement. La créer depuis : ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCHE"
          fi

      # Le travail finit en rouge si le code ne compile pas : la PR existe,
      # mais l'onglet Actions ne doit pas laisser croire que tout est prêt.
      - name: Signaler un typecheck en échec
        if: steps.typecheck.outputs.ok == 'false'
        run: |
          echo "::error::Les nouveaux types cassent la compilation — pull request ouverte, code à adapter avant fusion."
          exit 1
