name: Régénérer les types Supabase

# Lancement manuel depuis l'onglet « Actions » (bouton « Run workflow »).
# Régénère lib/database.types.ts depuis la base live et le committe sur la
# branche cible. Nécessite le secret SUPABASE_ACCESS_TOKEN (Settings > Secrets
# and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branche où écrire lib/database.types.ts
        required: true
        default: main

permissions:
  contents: write

jobs:
  gen-types:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche cible
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Installer Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Passe par scripts/gen-types.mjs (npm run gen:types) et non par une
      # redirection directe : le shell tronquerait lib/database.types.ts avant
      # même de lancer la CLI, si bien qu'un jeton expiré ferait COMMITTER le
      # message d'erreur JSON à la place des types. Le script n'écrit la cible
      # qu'une fois la génération réellement aboutie, et sort en échec sinon.
      # Aucun `npm ci` nécessaire : il ne tire que des modules natifs de Node.
      - name: Générer les types depuis Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run gen:types

      - name: Committer si le fichier a changé
        run: |
          if git diff --quiet -- lib/database.types.ts; then
            echo "Types déjà à jour — rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/database.types.ts
          git commit -m "Types : régénération authentique depuis Supabase (gen types)"
          git push origin HEAD:${{ inputs.branch }}
